# OpenEvolve configuration for the disaster-vision surrogate task.
#
# This task evolves the training recipe used by the change-family experiments
# in disaster_vision-main/jobs/. The evaluator uses historical runs as a
# surrogate score because the private dataset is not bundled with this repo.

max_iterations: 60
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

diff_based_evolution: true
allow_full_rewrites: false
max_program_length: 12000

llm:
  primary_model: "gemini-2.5-flash-lite"
  primary_model_weight: 0.8
  secondary_model: "gemini-2.5-flash"
  secondary_model_weight: 0.2
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096
  timeout: 120

prompt:
  num_top_programs: 4
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 12000
  system_message: |
    You are optimizing the disaster-vision change-detection training recipe.

    The strongest historical runs in this project share a pattern:
    - shared Siamese encoders outperform separate encoders
    - bottleneck fusion is usually stronger than multiscale on the joint score
    - concat plus absolute-difference fusion is the most promising family
    - `cls_weight` near 2.0 and `lr` near 3e-4 are good defaults

    Improve the configuration returned by the program while keeping it valid.
    Favor compact changes that move toward stronger historical recipes.

database:
  population_size: 36
  archive_size: 18
  num_islands: 4
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.65

evaluator:
  timeout: 10
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 4
  use_llm_feedback: false

early_stopping_patience: 20
early_stopping_metric: "combined_score"
